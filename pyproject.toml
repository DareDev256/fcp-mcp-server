[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcp-mcp-server"



version = "0.16.0"

description = "MCP server for Final Cut Pro XML. 7 grouped tools (62 underlying operations) for timeline analysis, batch editing, QC, generation, multi-track support, NLE export, templates, media relink, .fcpxmld bundles, and real media analysis (silence detection + auto-removal, beat detection, local Whisper transcript editing) via Claude."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DareDev256", email = "dare@jamesdare.com"}
]
keywords = ["final-cut-pro", "mcp", "video-editing", "fcpxml", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = [
    # BOTH bounds are load-bearing — keep this pin in sync with requirements.txt.
    #
    # Lower bound 1.3.0: server.py imports
    # `mcp.server.lowlevel.helper_types.ReadResourceContents`, which does not
    # exist before mcp 1.3.0. On anything older the server raises ImportError at
    # startup and the MCP client just reports "disconnected" with no traceback.
    # That type is what lets `preview://` return a real text/html mime type, so
    # there is deliberately no try/except fallback — degrading to text/plain
    # would silently break the timeline preview instead of failing loudly.
    #
    # Upper bound 2.0.0: mcp 2.0.0 (2026-07-28) removed the low-level Server
    # decorator API (list_tools/call_tool/list_resources/read_resource/
    # list_prompts/get_prompt) that server.py is built on, replaced by
    # add_request_handler. Lift this only alongside the 2.x migration (issue #9).
    "mcp>=1.3.0,<2.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
intelligence = [
    "librosa>=0.10.0",
]
transcribe = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/DareDev256/fcp-mcp-server"
Repository = "https://github.com/DareDev256/fcp-mcp-server.git"
Issues = "https://github.com/DareDev256/fcp-mcp-server/issues"
Changelog = "https://github.com/DareDev256/fcp-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
fcp-mcp-server = "server:main_sync"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fcpxml*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
